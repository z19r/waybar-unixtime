[package]
name = "waybar-unixtime"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "Live unix timestamps for Waybar, themed by your omarchy theme"
license = "MIT"
repository = "https://github.com/z19r/waybar-unixtime"
homepage = "https://waybar-unixtime.z19r.com"
keywords = ["waybar", "hyprland", "unix-time", "omarchy", "statusbar"]
categories = ["command-line-utilities", "date-and-time"]
readme = "README.md"

[[bin]]
name = "waybar-unixtime"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
